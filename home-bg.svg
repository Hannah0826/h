<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffefe"/>
      <stop offset="55%" stop-color="#fff7fb"/>
      <stop offset="100%" stop-color="#ffeef7"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4c9" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#fff4c9" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff0f8"/>
      <stop offset="100%" stop-color="#ffd9ea"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="2.5" fill="#ffb8d4" opacity="0.16"/>
    </pattern>
  </defs>

  <rect width="1440" height="900" fill="url(#wall)"/>
  <polygon points="0,0 480,0 680,900 0,900" fill="url(#sunbeam)"/>

  <!-- string lights -->
  <path d="M80 52 Q720 88 1360 52" fill="none" stroke="#ffd35a" stroke-width="2" opacity="0.42"/>
  <g fill="#fff6a8" opacity="0.82">
    <circle cx="160" cy="66" r="6"/><circle cx="340" cy="78" r="6"/><circle cx="520" cy="70" r="6"/>
    <circle cx="720" cy="82" r="7"/><circle cx="920" cy="70" r="6"/><circle cx="1100" cy="78" r="6"/><circle cx="1280" cy="66" r="6"/>
  </g>

  <!-- ceiling line -->
  <line x1="0" y1="44" x2="1440" y2="44" stroke="#f5e6ef" stroke-width="4"/>

  <!-- left window -->
  <rect x="48" y="72" width="248" height="268" rx="12" fill="#fff8ef" stroke="#e8c9a0" stroke-width="4"/>
  <rect x="68" y="88" width="208" height="236" rx="10" fill="#dff3ff" stroke="#c7e3f3" stroke-width="7"/>
  <line x1="172" y1="88" x2="172" y2="324" stroke="#c7e3f3" stroke-width="4"/>
  <line x1="68" y1="206" x2="276" y2="206" stroke="#c7e3f3" stroke-width="4"/>
  <rect x="48" y="72" width="32" height="268" rx="8" fill="#ffd9ea" opacity="0.72"/>
  <rect x="264" y="72" width="32" height="268" rx="8" fill="#ffd9ea" opacity="0.72"/>
  <rect x="60" y="332" width="224" height="14" rx="4" fill="#e7bb7d"/>
  <ellipse cx="108" cy="324" rx="20" ry="12" fill="#9ed88a"/>
  <rect x="100" y="310" width="16" height="16" rx="4" fill="#c89563"/>

  <!-- wall shelves -->
  <rect x="360" y="148" width="220" height="12" rx="4" fill="#e7bb7d"/>
  <rect x="364" y="160" width="8" height="44" fill="#d8a86a"/>
  <rect x="572" y="160" width="8" height="44" fill="#d8a86a"/>
  <rect x="388" y="124" width="52" height="40" rx="8" fill="#ffd9ea" stroke="#ffb8d4" stroke-width="3"/>
  <rect x="452" y="130" width="38" height="34" rx="6" fill="#fff8ef" stroke="#e8c9a0" stroke-width="3"/>
  <rect x="502" y="134" width="24" height="28" rx="4" fill="#ff8fab"/>
  <rect x="538" y="128" width="32" height="36" rx="4" fill="#6eb5ff" opacity="0.35" stroke="#4f97e6" stroke-width="2"/>

  <!-- picture frames -->
  <rect x="640" y="96" width="96" height="76" rx="6" fill="#fff" stroke="#e8c9a0" stroke-width="5"/>
  <circle cx="688" cy="130" r="18" fill="#ffd7a8"/>
  <rect x="756" y="88" width="108" height="86" rx="6" fill="#fff" stroke="#e8c9a0" stroke-width="5"/>
  <ellipse cx="810" cy="128" rx="22" ry="18" fill="#ffc9de"/>
  <rect x="884" y="98" width="88" height="72" rx="6" fill="#fff" stroke="#e8c9a0" stroke-width="5"/>
  <path d="M908 132c14-10 32-10 46 0" fill="none" stroke="#ffb07a" stroke-width="5" stroke-linecap="round"/>

  <!-- pendant lamp -->
  <line x1="980" y1="44" x2="980" y2="108" stroke="#8c7c99" stroke-width="3"/>
  <path d="M944 108h72l-10 34H954z" fill="#fff6d8" stroke="#e8c9a0" stroke-width="3"/>
  <ellipse cx="980" cy="152" rx="44" ry="12" fill="#fff4c9" opacity="0.5"/>

  <!-- right cat tree -->
  <rect x="1180" y="520" width="18" height="220" rx="6" fill="#c89563"/>
  <rect x="1140" y="420" width="96" height="14" rx="6" fill="#d8a86a"/>
  <rect x="1160" y="320" width="72" height="12" rx="6" fill="#d8a86a"/>
  <ellipse cx="1196" cy="410" rx="52" ry="10" fill="#ffe3c9" opacity="0.55"/>
  <ellipse cx="1196" cy="310" rx="44" ry="9" fill="#ffe3c9" opacity="0.5"/>

  <!-- fish jar -->
  <rect x="1060" y="388" width="78" height="10" rx="3" fill="#d8a86a"/>
  <ellipse cx="1099" cy="372" rx="34" ry="26" fill="#dff3ff" stroke="#6eb5ff" stroke-width="4"/>
  <ellipse cx="1099" cy="378" rx="26" ry="8" fill="#6eb5ff" opacity="0.25"/>
  <text x="1088" y="378" font-size="16">🐟</text>

  <!-- center play rug -->
  <ellipse cx="720" cy="620" rx="420" ry="110" fill="url(#rug)" opacity="0.72"/>
  <ellipse cx="720" cy="620" rx="380" ry="92" fill="url(#dots)"/>

  <!-- cat bed -->
  <ellipse cx="280" cy="720" rx="88" ry="36" fill="#ffd9ea" opacity="0.65"/>
  <ellipse cx="280" cy="712" rx="64" ry="22" fill="#fff" opacity="0.45"/>

  <!-- scratch post -->
  <rect x="1120" y="640" width="52" height="120" rx="10" fill="#e8c9a0"/>
  <rect x="1110" y="628" width="72" height="18" rx="8" fill="#d8a86a"/>
  <ellipse cx="1146" cy="622" rx="38" ry="12" fill="#ffb8d4" opacity="0.55"/>

  <!-- scattered toys -->
  <circle cx="420" cy="680" r="14" fill="#6eb5ff" stroke="#4f97e6" stroke-width="3"/>
  <circle cx="520" cy="710" r="11" fill="#ffd35a" stroke="#efb73a" stroke-width="3"/>
  <circle cx="960" cy="690" r="12" fill="#9ee7d8" stroke="#58c9b0" stroke-width="3"/>
  <circle cx="860" cy="720" r="10" fill="#ffb8cc" stroke="#e86b88" stroke-width="3"/>

  <!-- yarn -->
  <circle cx="340" cy="640" r="16" fill="#ffb8cc" stroke="#e86b88" stroke-width="3"/>
  <path d="M340 624v32M324 640h32" stroke="#fff" stroke-width="2" opacity="0.5"/>

  <!-- hearts & paws -->
  <g fill="#ff9ec6" opacity="0.32">
    <g transform="translate(180 560)"><circle r="10"/><circle cx="-14" cy="-16" r="6"/><circle cx="14" cy="-16" r="6"/><circle cx="-18" cy="4" r="6"/><circle cx="18" cy="4" r="6"/></g>
    <g transform="translate(1240 580) scale(0.9)"><circle r="10"/><circle cx="-14" cy="-16" r="6"/><circle cx="14" cy="-16" r="6"/><circle cx="-18" cy="4" r="6"/><circle cx="18" cy="4" r="6"/></g>
    <g transform="translate(220 820) scale(0.85)"><circle r="10"/><circle cx="-14" cy="-16" r="6"/><circle cx="14" cy="-16" r="6"/><circle cx="-18" cy="4" r="6"/><circle cx="18" cy="4" r="6"/></g>
    <g transform="translate(1180 820) scale(0.95)"><circle r="10"/><circle cx="-14" cy="-16" r="6"/><circle cx="14" cy="-16" r="6"/><circle cx="-18" cy="4" r="6"/><circle cx="18" cy="4" r="6"/></g>
  </g>
  <text x="150" y="480" font-size="28" opacity="0.22">💕</text>
  <text x="1260" y="460" font-size="24" opacity="0.2">💕</text>
  <text x="680" y="820" font-size="22" opacity="0.18">🐾</text>
  <text x="760" y="840" font-size="18" opacity="0.16">🐾</text>

  <!-- bottom wash -->
  <ellipse cx="720" cy="940" rx="860" ry="260" fill="#ffd3e8" opacity="0.55"/>
  <ellipse cx="260" cy="880" rx="340" ry="160" fill="#ffc9e0" opacity="0.4"/>
  <ellipse cx="1180" cy="890" rx="320" ry="150" fill="#ffe5f2" opacity="0.42"/>

  <!-- soft center highlight for panel area -->
  <ellipse cx="720" cy="480" rx="520" ry="280" fill="#ffffff" opacity="0.35"/>
</svg>
