  <ellipse class="purr-2" cx="320" cy="180" rx="110" ry="68" fill="none" stroke="#ff8fcb" stroke-width="2" opacity=".35"/>
  <ellipse class="purr-3" cx="320" cy="180" rx="140" ry="86" fill="none" stroke="#ffd35a" stroke-width="2" opacity=".25"/>

