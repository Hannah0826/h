<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="+��x">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff5f8"/>
      <stop offset="100%" stop-color="#ffe8f0"/>
    </linearGradient>
    <linearGradient id="catBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc978"/>
      <stop offset="100%" stop-color="#ff9f4a"/>
    </linearGradient>
    <linearGradient id="hand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe8d8"/>
      <stop offset="100%" stop-color="#f5c9a8"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes handPet { 0%,100% { transform: translate(0, 0); } 50% { transform: translate(0, 10px); } }
    @keyframes purrWave { 0% { opacity: 0; transform: scale(.8); } 30% { opacity: .7; } 100% { opacity: 0; transform: scale(1.3); } }
    @keyframes happySquint { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(.25); } }
    @keyframes tailPurr { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }
    @keyframes heartFloat { 0% { opacity: 0; transform: translateY(0); } 40% { opacity: 1; } 100% { opacity: 0; transform: translateY(-28px); } }
    @keyframes zzz { 0% { opacity: 0; } 30% { opacity: .8; } 100% { opacity: 0; transform: translate(12px,-16px); } }
    .hand { animation: handPet 1.1s ease-in-out infinite; transform-origin: 320px 120px; }
    .purr-1 { animation: purrWave 1.4s ease-out infinite; transform-origin: 320px 180px; }
    .purr-2 { animation: purrWave 1.4s ease-out infinite .35s; transform-origin: 320px 180px; }
    .purr-3 { animation: purrWave 1.4s ease-out infinite .7s; transform-origin: 320px 180px; }
    .cat-eye { animation: happySquint 1.1s ease-in-out infinite; transform-origin: center; }
    .cat-tail { animation: tailPurr .55s ease-in-out infinite; transform-origin: 420px 260px; }
    .heart-a { animation: heartFloat 2s ease-out infinite; }
    .heart-b { animation: heartFloat 2s ease-out infinite .7s; }
    .zzz-a { animation: zzz 2.4s ease-out infinite; }
  </style>

