  <g class="hand">
    <ellipse cx="320" cy="118" rx="46" ry="34" fill="url(#hand)" stroke="#e8b898" stroke-width="3"/>
    <ellipse cx="296" cy="132" rx="10" ry="18" fill="url(#hand)" stroke="#e8b898" stroke-width="2" transform="rotate(-15 296 132)"/>
    <ellipse cx="314" cy="138" rx="10" ry="20" fill="url(#hand)" stroke="#e8b898" stroke-width="2"/>
