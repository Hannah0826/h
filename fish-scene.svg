<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="+|r">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff7ef"/>
      <stop offset="100%" stop-color="#ffe8d4"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#ffe8ef"/>
    </linearGradient>
    <linearGradient id="catBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffc978"/>
      <stop offset="100%" stop-color="#ff9f4a"/>
    </linearGradient>
  </defs>
  <style>
    @keyframes munch { 0%,100% { transform: translateY(0) rotate(0deg); } 25% { transform: translateY(4px) rotate(-2deg); } 75% { transform: translateY(2px) rotate(2deg); } }
    @keyframes tailHappy { 0%,100% { transform: rotate(8deg); } 50% { transform: rotate(-12deg); } }
    @keyframes fishPop { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(12px) scale(.4); } }
    @keyframes crunch { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.2); } }
    @keyframes steam { 0% { opacity: .5; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-16px); } }
    @keyframes heart { 0% { opacity: 0; transform: translateY(0) scale(.6); } 40% { opacity: 1; transform: translateY(-8px) scale(1); } 100% { opacity: 0; transform: translateY(-24px) scale(.8); } }
    .cat-head { animation: munch .55s ease-in-out infinite; transform-origin: 320px 170px; }
    .cat-tail { animation: tailHappy .4s ease-in-out infinite; transform-origin: 220px 250px; }
    .fish-a { animation: fishPop 1.6s ease-in infinite; }
    .fish-b { animation: fishPop 1.6s ease-in infinite .55s; }
    .fish-c { animation: fishPop 1.6s ease-in infinite 1.1s; }
    .crunch-a { animation: crunch .8s ease-out infinite; transform-origin: center; }
    .crunch-b { animation: crunch .8s ease-out infinite .35s; transform-origin: center; }
    .steam-a { animation: steam 1.4s ease-out infinite; }
    .steam-b { animation: steam 1.4s ease-out infinite .45s; }
    .heart-a { animation: heart 1.8s ease-out infinite; }
    .heart-b { animation: heart 1.8s ease-out infinite .6s; }
  </style>

  <rect width="640" height="360" fill="url(#wall)"/>
  <rect x="0" y="250" width="640" height="110" fill="#f3d5a8"/>
  <rect x="0" y="250" width="640" height="8" fill="#e8c08d"/>

  <ellipse cx="320" cy="268" rx="120" ry="18" fill="#000" opacity=".06"/>
  <path d="M210 268 Q320 210 430 268 L430 290 Q320 320 210 290 Z" fill="url(#bowl)" stroke="#ffb8d4" stroke-width="4"/>
  <ellipse cx="320" cy="268" rx="108" ry="14" fill="#fff8fb"/>

  <g class="fish-a">
    <path d="M280 258 Q292 248 304 258 L300 262 Q292 256 284 262 Z" fill="#f07a3a"/>
    <circle cx="298" cy="256" r="2" fill="#fff"/>
  </g>
  <g class="fish-b">
    <path d="M318 254 Q330 244 342 254 L338 258 Q330 252 322 258 Z" fill="#ff9a4a"/>
    <circle cx="336" cy="252" r="2" fill="#fff"/>
  </g>
  <g class="fish-c">
    <path d="M350 260 Q362 250 374 260 L370 264 Q362 258 354 264 Z" fill="#f07a3a"/>
    <circle cx="368" cy="258" r="2" fill="#fff"/>
  </g>

  <text class="crunch-a" x="300" y="238" font-size="14" fill="#ffb65b" font-weight="700">��</text>
  <text class="crunch-b" x="340" y="232" font-size="12" fill="#ff8fcb" font-weight="700">��</text>

  <g class="cat-tail">
    <path d="M220 250 Q190 220 200 190 Q210 180 228 200" fill="none" stroke="#e8873a" stroke-width="10" stroke-linecap="round"/>
  </g>
  <ellipse cx="260" cy="248" rx="42" ry="34" fill="url(#catBody)"/>

  <g class="cat-head">
    <circle cx="320" cy="170" r="58" fill="url(#catBody)"/>
    <polygon points="278,118 288,88 298,118" fill="#ff9f4a"/>
    <polygon points="342,118 352,88 362,118" fill="#ff9f4a"/>
    <path d="M296 168 Q320 188 344 168" fill="#fff" opacity=".85"/>
    <circle cx="300" cy="158" r="5" fill="#4a3728"/>
    <circle cx="340" cy="158" r="5" fill="#4a3728"/>
    <path d="M308 182 Q320 192 332 182" fill="none" stroke="#c76b45" stroke-width="3" stroke-linecap="round"/>
    <ellipse cx="352" cy="176" rx="8" ry="6" fill="#ffb8d4" opacity=".5"/>
  </g>

  <g class="steam-a" opacity=".45">
    <path d="M308 120 Q312 108 308 96" fill="none" stroke="#ffd35a" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g class="steam-b" opacity=".45">
    <path d="M332 118 Q336 106 332 94" fill="none" stroke="#ffd35a" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text class="heart-a" x="380" y="130" font-size="18" fill="#ff8fcb">e</text>
  <text class="heart-b" x="250" y="140" font-size="14" fill="#ffb65b">e</text>

  <text x="24" y="34" font-family="sans-serif" font-size="16" fill="#c76b45" font-weight="700">����^|r��</text>
</svg>
