  <style>
    @keyframes rain { 0% { transform: translateY(-20px); opacity: 0; } 20% { opacity: .5; } 100% { transform: translateY(360px); opacity: 0; } }
    @keyframes tailSlow { 0%,100% { transform: rotate(6deg); } 50% { transform: rotate(-4deg); } }
    @keyframes blink { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
    @keyframes sigh { 0%,100% { opacity: 0; transform: translateY(0); } 50% { opacity: .7; transform: translateY(-8px); } }
    @keyframes clockTick { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(6deg); } }
    @keyframes doorGlow { 0%,100% { opacity: .15; } 50% { opacity: .35; } }
    .raindrop { animation: rain 1.2s linear infinite; }
    .rain-b { animation: rain 1.5s linear infinite .3s; }
    .rain-c { animation: rain 1.1s linear infinite .6s; }
    .cat-tail { animation: tailSlow 2.8s ease-in-out infinite; transform-origin: 390px 250px; }
    .cat-eye { animation: blink 4s ease-in-out infinite; transform-origin: center; }
    .sigh { animation: sigh 3s ease-in-out infinite; }
    .clock-hand { animation: clockTick 2s ease-in-out infinite; transform-origin: 540px 88px; }
    .door-light { animation: doorGlow 2.5s ease-in-out infinite; }
  </style>

